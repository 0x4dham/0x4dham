name: TryHackMe Update Badge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Badge
        run: |
          curl -sL https://tryhackme-badges.s3.amazonaws.com/4dham.png -o assets/thm-badge.png
          ls -lh assets/thm-badge.png
          file assets/thm-badge.png

      - name: Commit Badge
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash push -m "badge" --keep-index
          git pull --rebase
          git stash pop || true
          git add assets/thm-badge.png
          git diff --staged --quiet || git commit -m "Update THM badge"
          git push
