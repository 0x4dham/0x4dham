name: TryHackMe Update Badge
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch THM badge
        run: |
          mkdir -p assets
          curl -L -o assets/thm-badge.png https://tryhackme-badges.s3.amazonaws.com/4dham.png
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/thm-badge.png
          git diff --staged --quiet || (git commit -m "Update THM badge" && git push)
